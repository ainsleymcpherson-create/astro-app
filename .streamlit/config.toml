# Raises the window Streamlit keeps a disconnected session's state
# alive, waiting for a possible reconnect, from the 120-second default
# to comfortably exceed the app's longest operation ("Generate Full
# Reading," which the UI itself labels as up to 5 minutes / 300s).
#
# Why this matters: if a websocket connection blips (common on mobile,
# e.g. screen lock or a brief network handoff) early in a long
# generation, and the server cleans up the session before generation
# finishes, even a successful reconnect from the browser has nothing
# left to reconnect to -- the result can't be delivered and the UI
# hangs/grays out. A longer TTL gives real reconnect attempts a
# window that actually covers the generation time.
#
# This does NOT guarantee every disconnect recovers cleanly -- brief
# blips get a real chance to reconnect, but a connection that's truly
# gone (e.g. tab closed, phone put to sleep for an extended period)
# still won't resume. For guaranteed delivery regardless of connection
# stability, "Generate Summary and Email Full Reading" remains the
# more resilient choice, since it doesn't depend on the live
# connection surviving the full generation window at all.
[server]
disconnectedSessionTTL = 600

# Visual identity: pulls from astrology's own instruments -- ephemeris
# tables, brass astrolabes, ink-on-vellum star charts -- rather than
# generic "mystic" cliches or default AI-design palettes.
#   primaryColor            brass/astrolabe gold -- buttons, active
#                            tabs, links, interactive highlights
#   backgroundColor          midnight indigo -- main content area,
#                            evokes the night sky the whole practice
#                            is actually about
#   secondaryBackgroundColor a lighter indigo step -- sidebar, input
#                            widgets, card-like surfaces
#   textColor                warm parchment -- body text, readable
#                            against the indigo without stark white
#
# Typography: Fraunces (display serif with real antique character,
# used for headings only) paired with Karla (a warm, humanist sans
# for body text/long-form reading content, so extended readings stay
# comfortable) and IBM Plex Mono (utility face for chart data/degrees
# -- leans into the "almanac" feeling for numeric content).
[theme]
primaryColor = "#C9A66B"
backgroundColor = "#1B2036"
secondaryBackgroundColor = "#252B47"
textColor = "#EDE6D6"
font = "Karla:https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap, serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
